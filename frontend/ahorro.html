<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mi Ahorro — CarteraApp</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/ahorro.css" />
</head>

<body>

    <!-- La navbar se inyecta automáticamente -->

    <main class="main-content">

        <!-- Cabecera -->

        <div class="page-header">

            <div>
                <h1 class="page-title">
                    Ahorro
                </h1>

                <span class="last-update" id="lastUpdate"></span>
            </div>

            <button class="btn-primary" id="btnNuevoMovimiento">
                + Nuevo movimiento
            </button>

        </div>


        <!-- Tarjetas resumen -->

        <div class="summary-cards">

            <div class="card">
                <span class="card-label">
                    Total Neto Ingresado
                </span>

                <span class="card-value" id="totalNeto">
                    —
                </span>
            </div>


            <div class="card">
                <span class="card-label">
                    2024
                </span>

                <span class="card-value" id="total2024">
                    —
                </span>
            </div>


            <div class="card">
                <span class="card-label">
                    2025
                </span>

                <span class="card-value" id="total2025">
                    —
                </span>
            </div>


            <div class="card">
                <span class="card-label">
                    2026
                </span>

                <span class="card-value" id="total2026">
                    —
                </span>
            </div>

        </div>


        <!-- Tabla de movimientos -->

        <div class="table-wrapper">

            <div class="table-toolbar">

                <input type="text" id="buscador" class="input-search" placeholder="🔍 Buscar movimiento..." />

            </div>


            <div class="table-scroll">

                <table class="tabla-cartera" id="tablaAhorro">

                    <thead>

                        <tr>

                            <th>Fecha</th>

                            <th>Tipo</th>

                            <th class="text-right">
                                Importe
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tablaBody">

                        <tr class="fila-loading">

                            <td colspan="3">
                                ⏳ Cargando movimientos...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <!-- Modal nuevo movimiento -->
    <div class="modal-overlay" id="modalMovimiento">

        <div class="modal">

            <div class="modal-header">
                <h2>Nuevo movimiento</h2>

                <button type="button" class="modal-close" id="btnCerrarModal">
                    ×
                </button>
            </div>

            <form id="formMovimiento">

                <div class="form-group">
                    <label for="tipoMovimiento">
                        Tipo
                    </label>

                    <select id="tipoMovimiento" name="tipo" required>
                        <option value="ingreso">
                            Ingreso
                        </option>

                        <option value="retirada">
                            Retirada
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="importeMovimiento">
                        Importe (€)
                    </label>

                    <input type="number" id="importeMovimiento" name="importe" min="0.01" step="0.01" placeholder="0,00"
                        required />
                </div>


                <div class="form-group">
                    <label for="fechaMovimiento">
                        Fecha
                    </label>

                    <input type="date" id="fechaMovimiento" name="fecha" required />
                </div>


                <div class="form-error" id="errorMovimiento"></div>


                <div class="modal-actions">

                    <button type="button" class="btn-secondary" id="btnCancelarMovimiento">
                        Cancelar
                    </button>

                    <button type="submit" class="btn-primary" id="btnGuardarMovimiento">
                        Guardar
                    </button>

                </div>  

            </form>

        </div>

    </div>

    <script src="components/navbar.js"></script>

    <script src="js/ahorro.js"></script>

</body>

</html>
